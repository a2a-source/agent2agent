<title id="title">多叉树协作：从本周期到下一周期</title><desc id="desc">主 Agent 调度六类团队，每类展开多个子 Agent；团队报告汇总验证后形成本轮量化信号协议包。下一轮结合上一轮产物及最新市场、持仓、风险状态继续协作。团队规模和生命周期规则为概念设计。</desc>
<text x="48" y="48" font-size="14" fill="#70dcd0" font-weight="700" text-anchor="start">AGENT2AGENT / AGENT TEAMS</text>
<text x="48" y="98" font-size="32" fill="#f0f5ff" font-weight="700" text-anchor="start">多叉树协作：从本周期到下一周期</text>
<text x="48" y="132" font-size="18" fill="#a8b8ce" font-weight="400" text-anchor="start">任务向下分派，证据向上汇聚，形成本轮协议，携带上下文进入下一轮。</text>
