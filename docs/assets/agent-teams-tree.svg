<text x="48" y="1057" font-size="14" fill="#70dcd0" font-weight="700" text-anchor="start">TREE = TASK ORGANIZATION, NOT A NEW CONSENSUS HIERARCHY</text>
<text x="48" y="1089" font-size="16" fill="#a8b8ce" font-weight="400" text-anchor="start">Two sub-agents per team are illustrative. Team size, verification, publication and failure rules remain open.</text>
