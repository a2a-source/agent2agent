<title id="title">Multi-agent collaboration, from epoch n to n + 1</title><desc id="desc">Master Agent dispatches six teams, each with multiple sub-agents. Team reports converge into validation and a QSP. The next epoch uses the previous output and refreshed portfolio, risk and market context. Team sizes and lifecycle rules are conceptual.</desc>
<text x="48" y="48" font-size="14" fill="#70dcd0" font-weight="700" text-anchor="start">AGENT2AGENT / AGENT TEAMS</text>
<text x="48" y="98" font-size="32" fill="#f0f5ff" font-weight="700" text-anchor="start">Multi-agent collaboration, from epoch n to n + 1</text>
<text x="48" y="132" font-size="18" fill="#a8b8ce" font-weight="400" text-anchor="start">Fan out tasks. Converge evidence. Produce a protocol. Carry context into the next round.</text>
